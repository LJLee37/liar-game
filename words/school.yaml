# yaml-language-server: $schema=./schema.json
name: 학교·문구
icon: ✏️
description: 문구, 교실 물건, 과목과 학교 생활

groups:
  문구:
    - 연필
    - 샤프: [샤프펜슬]
    - 볼펜
    - 형광펜
    - 색연필
    - 크레파스
    - 지우개
    - 자
    - 가위
    - 풀
    - 테이프: [셀로판테이프, 스카치테이프]
    - 스테이플러: [호치키스]
    - 공책: [노트]
    - 필통
  교실 물건:
    - 칠판
    - 분필
    - 칠판지우개
    - 교탁
    - 사물함
    - 교과서
    - 출석부
    - 지구본: [지구의]
    - 실내화
    - 책가방
  과목:
    - 국어
    - 영어
    - 수학
    - 과학
    - 사회
    - 역사
    - 음악
    - 미술
    - 체육
    - 도덕
    - 한문
  학교 생활:
    - 입학식
    - 졸업식
    - 운동회
    - 소풍
    - 수학여행
    - 방학
    - 중간고사
    - 숙제
    - 급식
    - 반장
    - 짝꿍: [짝]
    - 교복
    - 수능: [대학수학능력시험]
