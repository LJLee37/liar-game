    - 수상스키
    - 카누
    - 카약
    - 래프팅
  육상·기타:
    - 마라톤
    - 높이뛰기
    - 멀리뛰기
    - 장대높이뛰기
    - 허들
    - 창던지기
    - 체조
    - 역도
    - 양궁
    - 사격
    - 승마
