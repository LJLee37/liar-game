# yaml-language-server: $schema=./schema.json
#
# 새 카테고리 템플릿 — 이 파일을 복사해 `words/<영문-id>.yaml`로 저장하세요.
# (파일 이름이 '_'로 시작하면 게임에서 무시됩니다.)
# 규칙 전체는 words/README.md 참고.

name: 카테고리 이름        # 필수: 화면에 보이는 이름
icon: 🎲                  # 선택: 이모지 하나
description: 설명 한 줄    # 선택

groups:                   # 소분류 (바보 모드는 같은 소분류에서 라이어 단어를 우선 고릅니다)
  소분류 A:
    - 단어1
    - 단어2: [별칭1, 별칭2]   # 별칭 = 정답으로 자동 인정되는 다른 표기
    - 단어3: 별칭             # 별칭이 하나면 괄호 생략 가능
  소분류 B:
    - 단어4
    - 단어5

words:                    # 소분류가 필요 없는 단어 (groups와 함께 써도 됩니다)
  - 단어6
