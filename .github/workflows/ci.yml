# 푸시할 때마다 타입 검사·단어 목록 검사·테스트·빌드를 실행한다.
# GitHub Actions 문서: https://docs.github.com/ko/actions
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 보안 패치가 나온 지원 버전 라인 (package.json engines 참고)
        node: ['22', '24', '26']
    name: check (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # 러너에 미리 깔린 구버전 대신 최신 패치 버전을 받는다 (engines 조건을 만족해야 npm ci가 됨)
          check-latest: true
          cache: npm
      - run: node --version
      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 단어 목록 검사 (중복·별칭 충돌)
        run: npm run check:words
      - name: 테스트
        run: npm test
      - name: 클라이언트 빌드
        run: npm run build
